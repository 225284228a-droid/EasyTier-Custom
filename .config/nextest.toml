[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }

# Ownership election and failover each include stable routes and ICMP checks
# across two admins. Keep the test's individual phase deadlines intact.
[[profile.default.overrides]]
filter = 'package(=easytier) and kind(lib) and test(=tests::credential_tests::credential_non_reusable_across_two_admins_allows_only_one_peer)'
slow-timeout = { period = "180s", terminate-after = 1 }

[profile.default.junit]
path = "junit.xml"
