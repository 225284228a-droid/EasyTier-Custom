name: prepare-build
author: Luna
description: Prepare build environment
inputs:
  target:
    description: 'The target to build for'
    required: false
  pnpm:
    description: 'Whether to install Node, pnpm and frontend dependencies (without building)'
    required: false
    default: 'false'
  components:
    description: 'Additional Rust components'
    required: false
    default: ''
  gui:
    description: 'Whether to prepare the GUI build environment'
    required: true
    default: 'false'
  token:
    description: 'GitHub token, used by setup-protoc action'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Record source revision
      run: echo "GIT_DESC=$(git log -1 --format=%cd.%h --date=format:%Y-%m-%d_%H:%M:%S)" >> "$GITHUB_ENV"
      shell: bash

    - run: mkdir -p easytier-gui/dist
      shell: bash

    - name: Install dependencies
      if: ${{ runner.os == 'Linux' }}
      run: |
        sudo apt-get update
        sudo apt-get install -qqy build-essential mold musl-tools
      shell: bash

    - name: Setup protoc
      uses: arduino/setup-protoc@v3
      with:
        version: '35.1'
        # GitHub repo token to use to avoid rate limiter
        repo-token: ${{ inputs.token }}

    - name: Verify protoc version
      run: |
        version="$(protoc --version | tr -d '\r')"
        test "$version" = "libprotoc 35.1"
      shell: bash

    - name: Setup Frontend Environment
      if: ${{ inputs.pnpm == 'true' }}
      uses: ./.github/actions/prepare-pnpm

    - name: Install GUI dependencies (Linux)
      if: ${{ inputs.gui == 'true' && runner.os == 'Linux' }}
      run: |
        sudo apt-get install -qq xdg-utils \
        libappindicator3-dev \
        libgtk-3-dev \
        librsvg2-dev \
        libwebkit2gtk-4.1-dev \
        libxdo-dev
      shell: bash

    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: 1.95
        target: ${{ inputs.target }}
        components: ${{ inputs.components }}
        cache: false
        rustflags: ''
