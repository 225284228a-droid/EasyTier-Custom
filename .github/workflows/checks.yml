name: EasyTier CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: easytier-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Plan CI checks
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.plan.outputs.active }}
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      frontend: ${{ steps.plan.outputs.frontend }}
      config_generator: ${{ steps.plan.outputs.config_generator }}
      ci: ${{ steps.plan.outputs.ci }}
      go: ${{ steps.plan.outputs.go }}
      js: ${{ steps.plan.outputs.js }}
      nix: ${{ steps.plan.outputs.nix }}
      core_matrix: ${{ steps.plan.outputs.core_matrix }}
      gui_matrix: ${{ steps.plan.outputs.gui_matrix }}
      android_matrix: ${{ steps.plan.outputs.android_matrix }}
      check_matrix: ${{ steps.plan.outputs.check_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/github-script@v8
        id: plan
        with:
          script: |
            const prepare = require('./.github/scripts/prepare-build.js');
            await prepare({ github, context, core, workflowKind: 'check' });

  ci-scripts:
    name: CI script tests
    needs: prepare
    if: needs.prepare.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test .github/scripts/*.test.js .github/scripts/*.test.cjs

  frontend:
    name: Frontend unit tests and backend test resources
    needs: prepare
    if: needs.prepare.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-pnpm
      - uses: ./.github/actions/prepare-build
        if: needs.prepare.outputs.config_generator == 'true' && needs.prepare.outputs.full != 'true'
        with:
          target: wasm32-unknown-unknown
          token: ${{ github.token }}
      - uses: taiki-e/install-action@v2
        if: needs.prepare.outputs.config_generator == 'true' && needs.prepare.outputs.full != 'true'
        with:
          tool: wasm-pack
      - uses: Swatinem/rust-cache@v2
        if: needs.prepare.outputs.config_generator == 'true' && needs.prepare.outputs.full != 'true'
        with:
          shared-key: frontend-check-wasm
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: pnpm build:frontend:check
      - name: Check configuration generator and its WASM interface
        if: needs.prepare.outputs.config_generator == 'true' && needs.prepare.outputs.full != 'true'
        run: |
          pnpm --dir easytier-web/config-generator build:config-wasm
          pnpm --dir easytier-web/config-generator build:ci
      - run: pnpm test:frontend:ci
      - name: Package resources for Rust checks and backend tests
        run: tar -czf frontend-assets.tar.gz easytier-web/frontend/dist easytier-web/frontend-lib/dist easytier-gui/dist
      - uses: actions/upload-artifact@v5
        with:
          name: frontend-assets
          path: frontend-assets.tar.gz
          retention-days: 1
          if-no-files-found: error

  check:
    name: Check (${{ matrix.name }})
    needs: [prepare, frontend]
    if: needs.prepare.outputs.rust == 'true' && needs.prepare.outputs.full != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.check_matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      FEATURES: ${{ matrix.features }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          target: ${{ matrix.target }}
          token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: frontend-assets
      - run: tar -xzf frontend-assets.tar.gz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo check --locked --all-targets --target "$TARGET" --features "$FEATURES"
      - name: Stage Windows drivers for the GUI check
        if: runner.os == 'Windows'
        run: bash .github/scripts/copy-windows-drivers.sh "$TARGET" easytier-gui/src-tauri
      - name: Check native desktop GUI with the same toolchain
        if: runner.os == 'Windows' || runner.os == 'macOS'
        run: cargo check --locked --all-targets --target "$TARGET" -p easytier-gui --features custom-protocol

  lint:
    name: Rust lint, features and WASI
    needs: [prepare, frontend]
    if: needs.prepare.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          target: wasm32-wasip1
          components: rustfmt,clippy
          gui: true
          token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: frontend-assets
      - run: tar -xzf frontend-assets.tar.gz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-lint
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features full --all -- -D warnings
      - uses: taiki-e/install-action@v2
        if: needs.prepare.outputs.full == 'true' || github.event_name == 'workflow_dispatch'
        with:
          tool: cargo-hack
      - name: Check individual feature combinations
        if: needs.prepare.outputs.full == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo hack check --locked -p easytier --each-feature --exclude-features macos-ne --verbose
      - name: Check WASI feature combination
        run: >-
          cargo check --locked -p easytier-core --lib --target wasm32-wasip1
          --features management-rpc,proxy-smoltcp-stack,ring-crypto,wasi-crypto-offload
      - run: cargo metadata --format-version 1 --locked > /dev/null

  unit:
    name: Rust unit tests and network test archive
    needs: [prepare, frontend]
    if: needs.prepare.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          gui: true
          token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: frontend-assets
      - run: tar -xzf frontend-assets.tar.gz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-unit
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Protocol, Web and GUI backend tests
        run: >-
          cargo nextest run --locked -p easytier-proto -p easytier-web -p easytier-gui
          --test-threads 1 --no-fail-fast
      - name: Compile network tests once
        run: >-
          cargo nextest archive --locked --archive-file tests.tar.zst
          -p easytier -p easytier-core --features full
      - uses: actions/upload-artifact@v5
        with:
          name: tests
          path: tests.tar.zst
          retention-days: 1
          if-no-files-found: error

  network:
    name: Network tests (${{ matrix.name }})
    needs: [prepare, unit]
    if: needs.prepare.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: easytier
            filter: not test(tests::three_node)
          - name: three_node
            filter: test(tests::three_node) and not test(subnet_proxy_three_node_test)
          - name: subnet_proxy_three_node_test
            filter: test(subnet_proxy_three_node_test)
    env:
      TEST_FILTER: ${{ matrix.filter }}
    steps:
      - uses: actions/checkout@v5
      - name: Install network test dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qqy bridge-utils miniupnpd miniupnpd-iptables iptables
          sudo modprobe br_netfilter
          sudo modprobe tun
          if [ ! -e /dev/net/tun ]; then
            sudo mkdir -p /dev/net
            sudo mknod /dev/net/tun c 10 200
          fi
          sudo sysctl net.bridge.bridge-nf-call-iptables=0
          sudo sysctl net.bridge.bridge-nf-call-ip6tables=0
          sudo sysctl net.ipv6.conf.lo.disable_ipv6=0
          sudo ip addr add 2001:db8::2/64 dev lo
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: actions/download-artifact@v5
        with:
          name: tests
      - run: |
          sudo prlimit --pid $$ --nofile=1048576:1048576
          sudo -E env "PATH=$PATH" EASYTIER_LINUX_BPF_INTEGRATION=required \
            cargo nextest run --archive-file tests.tar.zst -E "$TEST_FILTER" \
            --profile ci --test-threads 1 --no-fail-fast

  android:
    name: Android ARM64 compile check
    needs: [prepare, frontend]
    if: needs.prepare.outputs.rust == 'true' && needs.prepare.outputs.full != 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.android_matrix) }}
    runs-on: ubuntu-24.04
    env:
      TARGET: ${{ format('{0}-linux-android', matrix.arch) }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0'
          packages: 'build-tools;34.0.0 ndk;26.0.10792818 platform-tools platforms;android-34'
      - name: Configure Android tools
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/ndk/26.0.10792818/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.0.10792818/" >> "$GITHUB_ENV"
      - uses: ./.github/actions/prepare-build
        with:
          target: ${{ env.TARGET }}
          token: ${{ github.token }}
      - uses: actions/download-artifact@v5
        with:
          name: frontend-assets
      - run: tar -xzf frontend-assets.tar.gz
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-check-${{ matrix.arch }}
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Check Android ARM64
        if: needs.prepare.outputs.full != 'true'
        run: cargo check --locked --lib --target "$TARGET" -p easytier-gui --features custom-protocol
  go:
    name: Go tests and generated proto consistency
    needs: prepare
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            easytier-go/go.sum
            easytier-go/examples/tun/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ github.token }}
      - run: go test ./...
        working-directory: easytier-go
      - run: go test ./...
        working-directory: easytier-go/examples/tun
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./easytier-go/script/generate-proto.sh
          git diff --exit-code -- easytier-go/proto

  js:
    name: JavaScript Hosts build and tests
    needs: prepare
    if: needs.prepare.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/prepare-build
        with:
          target: wasm32-wasip1
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false
      - run: pnpm --dir easytier-js install --frozen-lockfile
      - run: pnpm --dir easytier-js check

  nix:
    name: Nix environment check
    needs: prepare
    if: needs.prepare.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: DeterminateSystems/magic-nix-cache-action@v6
      # A build includes the equivalent check; avoid compiling the same set twice.
      - run: nix develop .#full --command cargo build --locked

  ci-result:
    name: CI result
    needs: [prepare, ci-scripts, frontend, check, lint, unit, network, android, go, js, nix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify every planned job succeeded
        env:
          WORKFLOW_KIND: check
          BUILD_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/check-build-results.js
