name: EasyTier Go

on:
  push:
    branches: ["develop", "main", "releases/**"]
    paths:
      - "easytier-go/**"
      - "easytier-proto/proto/**"
      - ".github/workflows/go.yml"
  pull_request:
    branches: ["develop", "main"]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "easytier-go/**"
      - "easytier-proto/proto/**"
      - ".github/workflows/go.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test Go modules
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            easytier-go/go.sum
            easytier-go/examples/tun/go.sum

      - name: Test main module
        working-directory: easytier-go
        run: go test ./...

      - name: Test TUN example module
        working-directory: easytier-go/examples/tun
        run: go test ./...

  proto-drift:
    name: Check generated Go proto code is fresh
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache: false

      - name: Install pinned protoc 35.1
        run: |
          curl -fsSLO https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          sudo unzip -o protoc-35.1-linux-x86_64.zip -d /usr/local bin/protoc include/google
          protoc --version

      - name: Install pinned protoc-gen-go v1.36.11
        run: go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11

      - name: Regenerate and compare
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          ./easytier-go/script/generate-proto.sh
          if ! git diff --exit-code -- easytier-go/proto; then
            echo "::error::easytier-go/proto/*.pb.go is stale. Run easytier-go/script/generate-proto.sh (protoc 35.1 + protoc-gen-go v1.36.11) and commit the result."
            exit 1
          fi
